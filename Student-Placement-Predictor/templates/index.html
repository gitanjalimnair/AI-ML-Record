<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Placement Predictor</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

<div class="glass">

    <h1>Student Placement Predictor</h1>

    <p class="subtitle">
        Enter the student's academic details to predict the placement outcome.
    </p>

    <form action="/predict" method="POST">

        <div class="input-group">

            <input
                type="number"
                name="iq"
                placeholder="IQ"
                required>

        </div>

        <div class="input-group">

            <input
                type="number"
                step="0.01"
                name="prev_sem"
                placeholder="Previous Semester Result"
                required>

        </div>

        <div class="input-group">

            <input
                type="number"
                step="0.01"
                name="cgpa"
                placeholder="CGPA"
                required>

        </div>

        <div class="input-group">

            <input
                type="number"
                name="academic"
                placeholder="Academic Performance (1-10)"
                required>

        </div>

        <div class="input-group">

            <select name="internship" required>

                <option value="" disabled selected>
                    Internship Experience
                </option>

                <option value="1">Yes</option>

                <option value="0">No</option>

            </select>

        </div>

        <div class="input-group">

            <input
                type="number"
                name="extracurricular"
                placeholder="Extra Curricular Score"
                required>

        </div>

        <div class="input-group">

            <input
                type="number"
                name="communication"
                placeholder="Communication Skills"
                required>

        </div>

        <div class="input-group">

            <input
                type="number"
                name="projects"
                placeholder="Projects Completed"
                required>

        </div>

        <button type="submit">

            Predict Placement

        </button>

    </form>

</div>

</body>

</html>
